<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker POC - Academic Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0db7ed 0%, #1d63ed 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 550px;
            text-align: center;
        }
        h1 {
            color: #0db7ed;
            margin-top: 0;
            font-size: 2.2rem;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
        }
        .badge {
            display: inline-block;
            background-color: #e1f5fe;
            color: #0288d1;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin: 5px;
        }
        .footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello from Docker!</h1>
        <p>Proof of Concept successfully deployed using <strong>Docker</strong> and <strong>Nginx Alpine</strong>.</p>
        <div>
            <span class="badge">Nginx Alpine</span>
            <span class="badge">Port 8080:80</span>
            <span class="badge">Docker Container</span>
        </div>
        <div class="footer">
            Academic Research Project &bull; DevOps &amp; Cloud Architecture
        </div>
    </div>
</body>
</html>
